name: Android Build (LUKKA Televisión)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Permisos de gradlew
        run: chmod +x gradlew

      - name: Pruebas unitarias + APK de depuración
        env:
          # Variables (Settings > Secrets and variables > Actions > Variables). No son secretos.
          LUKKA_LICENSE_API_URL: ${{ vars.LUKKA_LICENSE_API_URL }}
          LUKKA_LICENSE_PUBLIC_KEY: ${{ vars.LUKKA_LICENSE_PUBLIC_KEY }}
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Resumen de compilación
        if: success()
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          {
            echo "## LUKKA Televisión — compilación correcta"
            echo "- APK: \`$(basename "$APK")\` ($(du -h "$APK" | cut -f1))"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- API de licencias configurada: ${{ vars.LUKKA_LICENSE_API_URL != '' && 'sí' || 'NO (la app mostrará aviso de configuración)' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: LUKKA-Television-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar reportes de prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: app/build/reports/tests/
          if-no-files-found: ignore
